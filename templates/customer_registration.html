
{% include "head.html" %}
<div class="row" >
    <div class="w-20 mt-20"></div>
    <div class="w-60">
        <div class="card mt-100  bg-secondary">
            <div class="row">
            <div class="w-45">
                <img src="https://media.istockphoto.com/id/1297462599/photo/communal-services-workers-sweep-snow-from-road-in-winter-cleaning-city-streets-and-roads.jpg?s=612x612&w=0&k=20&c=cK9LKnjxAlIt95Qzr7a4eiGbaSrwlJSR4n-41fJx4Z8=" alt="" class="img" style="width:450px; height:350px;">
            </div>
            <div class="w-50 p-10">
                <div class="text-center text-secondary h5">Customer Register Here</div>
                <form action="/customer_registration_action" method="post">
                    <div class="row">
                        <div class="w-45 p-10">
                            <div class="form-group mt-20">
                                <input type="text" name="first_name" id="first_name" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="first_name" class="form-label"> Enter First Name</label>
                            </div>
                            <div class="form-group mt-20">
                                <input type="email" name="email" id="email" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="email" class="form-label"> Enter Email</label>
                            </div>
                            <div class="form-group mt-20">
                                <input type="password" name="password" id="password" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="password" class="form-label"> Enter Password</label>
                            </div>
                            <div class="form-group mt-20">
                                <input type="text" name="state" id="state" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="state" class="form-label"> Enter State</label>
                            </div>
                        </div>
                        <div class="w-45 p-10">
                            <div class="form-group mt-20">
                                <input type="text" name="last_name" id="last_name" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="last_name" class="form-label">Enter Last Name</label>
                            </div>
                            <div class="form-group mt-20">
                                <input type="phone" name="phone" id="phone" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="phone" class="form-label">Enter Phone</label>
                            </div>
                            <div class="form-group mt-20">
                                <input type="text" name="city" id="city" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="city" class="form-label">Enter City</label>
                            </div>
                             <div class="form-group mt-20">
                                <input type="number" name="zipcode" id="zipcode" class="form-control p-10 bg-secondary" placeholder="" required>
                                <label for="zipcode" class="form-label">Enter Zipcode</label>
                            </div>
                        </div>
                         <div class="form-group mt-20 w-100">
                             <textarea name="address" id="address" class="form-control p-10 bg-secondary" placeholder="" required></textarea>
                            <label for="address" class="form-label">Address</label>
                        </div>

                    </div>

                    <input type="submit" value="Register" class="btn bg-primary text-white p-5 mt-15">
                </form>

            </div>

            </div>
        </div>
    </div>
    <div class="w-60">

    </div>
</div>
