{% include "head.html" %}
<div class="row" >
    <div class="w-20 mt-20"></div>
    <div class="w-60">
        <div class="card mt-100  bg-secondary">
            <div class="row">
            <div class="w-45">
                <img src="https://img.freepik.com/premium-photo/cute-happy-snowman-toy-winter-background_303714-666.jpg" alt="" class="img" style="width:450px; height:300px;">
            </div>
            <div class="w-50 p-10">
                <div class="text-center text-secondary h5">Admin Login</div>
                <form action="/admin_login_action" method="POST">
                    <div class="form-group mt-20">
                        <input type="text" name="username" id="username" class="form-control p-10 bg-secondary" placeholder="" required>
                        <label for="username" class="form-label p-5">User Name</label>
                    </div>
                    <div class="form-group mt-25">
                        <input type="password" name="password" id="password" class="form-control p-10 bg-secondary" placeholder="" required>
                        <label for="password" class="form-label p-5">Password</label>
                    </div>
                    <input type="submit" value="Login" class="btn bg-primary text-white p-5 mt-15">
                </form>

            </div>

            </div>
        </div>
    </div>
    <div class="w-60">

    </div>
</div>
